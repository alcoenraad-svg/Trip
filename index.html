<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripLog Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12 font-sans">
  <div class="max-w-md mx-auto p-4">
    <!-- Header -->
    <header class="flex items-center justify-between mb-4">
      <div>
        <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
          <i class="fa-solid fa-route"></i> TripLog Pro
        </h1>
        <p class="text-xs text-slate-500">Rittenregistratie & Afstandsmeting</p>
      </div>
      <button onclick="exportCSV()" class="text-sm bg-white border border-slate-200 px-3 py-1.5 rounded-lg shadow-sm font-medium hover:bg-slate-50 flex items-center gap-1.5 text-slate-700">
        <i class="fa-solid fa-file-excel text-emerald-600"></i> Export
      </button>
    </header>

    <!-- Tab Navigatie -->
    <div class="grid grid-cols-2 gap-2 bg-slate-200 p-1 rounded-xl mb-4 text-center font-medium text-sm">
      <button id="tab-tracker-btn" onclick="switchTab('tracker')" class="py-2 rounded-lg bg-white shadow-sm text-blue-600 transition">
        <i class="fa-solid fa-location-arrow mr-1"></i> Live Rit
      </button>
      <button id="tab-manual-btn" onclick="switchTab('manual')" class="py-2 rounded-lg text-slate-600 transition">
        <i class="fa-solid fa-keyboard mr-1"></i> Handmatig
      </button>
    </div>

    <!-- TAB 1: LIVE TRACKER -->
    <div id="tab-tracker" class="space-y-4">
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 text-center">
        <!-- Status indicator Wake Lock -->
        <div id="wakeLockNotice" class="hidden mb-2 text-xs bg-amber-50 text-amber-700 px-2 py-1 rounded-full border border-amber-200 inline-block">
          <i class="fa-solid fa-sun"></i> Scherm blijft actief aan tijdens rit
        </div>

        <div class="text-5xl font-black text-slate-900 tracking-tight mb-1" id="live-distance">0.00</div>
        <div class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-2">Kilometer</div>

        <!-- Realtime GPS Status Indicator -->
        <div id="gps-status" class="text-xs text-slate-400 mb-4 bg-slate-50 py-1.5 px-3 rounded-lg border border-slate-100 inline-block font-mono">
          GPS stand-by
        </div>

        <div class="grid grid-cols-2 gap-4 py-3 border-y border-slate-100 text-slate-600 mb-6">
          <div>
            <div class="text-xs text-slate-400">Rijtijd</div>
            <div class="text-lg font-bold font-mono" id="live-time">00:00:00</div>
          </div>
          <div>
            <div class="text-xs text-slate-400">Gemiddeld</div>
            <div class="text-lg font-bold" id="live-speed">0.0 km/u</div>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex gap-3">
          <button id="start-btn" onclick="toggleTracker()" class="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-play"></i> Start Rit
          </button>
        </div>
      </div>
    </div>

    <!-- TAB 2: HANDMATIGE INVOER -->
    <div id="tab-manual" class="hidden space-y-4">
      <form id="manual-form" onsubmit="handleManualSubmit(event)" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-3">
        <div>
          <label class="text-xs font-semibold text-slate-500">Datum</label>
          <input type="date" id="m-date" required class="w-full mt-1 p-2 border border-slate-200 rounded-lg text-sm bg-slate-50">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-slate-500">Van</label>
            <input type="text" id="m-from" placeholder="Vertrekadres" required class="w-full mt-1 p-2 border border-slate-200 rounded-lg text-sm bg-slate-50">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Naar</label>
            <input type="text" id="m-to" placeholder="Aankomstadres" required class="w-full mt-1 p-2 border border-slate-200 rounded-lg text-sm bg-slate-50">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-xs font-semibold text-slate-500">Afstand (km)</label>
            <input type="number" step="0.1" id="m-km" placeholder="0.0" required class="w-full mt-1 p-2 border border-slate-200 rounded-lg text-sm bg-slate-50">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Rijtijd (optioneel)</label>
            <input type="text" id="m-duration" placeholder="bijv. 00:25" class="w-full mt-1 p-2 border border-slate-200 rounded-lg text-sm bg-slate-50">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Type</label>
            <select id="m-type" class="w-full mt-1 p-2 border border-slate-200 rounded-lg text-sm bg-slate-50">
              <option value="Zakelijk">Zakelijk</option>
              <option value="Privé">Privé</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition">
          Rit Toevoegen
        </button>
      </form>
    </div>

    <!-- STATS OVERZICHT -->
    <div class="grid grid-cols-3 gap-2 my-4 text-center">
      <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
        <div class="text-[11px] text-slate-400 font-medium">Totaal</div>
        <div class="text-lg font-bold text-slate-800" id="total-km">0.0 km</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
        <div class="text-[11px] text-blue-500 font-medium">Zakelijk</div>
        <div class="text-lg font-bold text-blue-600" id="business-km">0.0 km</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
        <div class="text-[11px] text-slate-400 font-medium">Privé</div>
        <div class="text-lg font-bold text-slate-600" id="private-km">0.0 km</div>
      </div>
    </div>

    <!-- RITTEN HISTORIE -->
    <div class="space-y-2">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">Opgeslagen Ritten</h2>
      <div id="trips-list" class="space-y-2"></div>
    </div>
  </div>

  <script>
    let trips = JSON.parse(localStorage.getItem('triplog_trips') || '[]');
    let isTracking = false;
    let watchId = null;
    let timerId = null;
    let secondsElapsed = 0;
    let distanceKm = 0;
    let lastCoords = null;
    let wakeLock = null;
    let updateCount = 0;

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById('wakeLockNotice').classList.remove('hidden');
        } catch (err) {
          console.log('Wake Lock fout:', err);
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
      document.getElementById('wakeLockNotice').classList.add('hidden');
    }

    function switchTab(tab) {
      document.getElementById('tab-tracker').classList.toggle('hidden', tab !== 'tracker');
      document.getElementById('tab-manual').classList.toggle('hidden', tab !== 'manual');
      document.getElementById('tab-tracker-btn').className = tab === 'tracker' ? 'py-2 rounded-lg bg-white shadow-sm text-blue-600 transition' : 'py-2 rounded-lg text-slate-600 transition';
      document.getElementById('tab-manual-btn').className = tab === 'manual' ? 'py-2 rounded-lg bg-white shadow-sm text-blue-600 transition' : 'py-2 rounded-lg text-slate-600 transition';
    }

    function formatDuration(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function toggleTracker() {
      const btn = document.getElementById('start-btn');
      const statusEl = document.getElementById('gps-status');

      if (!isTracking) {
        if (!navigator.geolocation) {
          alert('GPS wordt niet ondersteund door deze browser.');
          return;
        }
        isTracking = true;
        distanceKm = 0;
        secondsElapsed = 0;
        lastCoords = null;
        updateCount = 0;

        btn.innerHTML = '<i class="fa-solid fa-stop"></i> Stop & Rit Opslaan';
        btn.className = 'flex-1 py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2';

        statusEl.className = 'text-xs text-amber-600 mb-4 bg-amber-50 py-1.5 px-3 rounded-lg border border-amber-200 inline-block font-mono';
        statusEl.innerHTML = '<i class="fa-solid fa-satellite animate-pulse"></i> GPS zoekt satellieten...';

        requestWakeLock();

        timerId = setInterval(() => {
          secondsElapsed++;
          document.getElementById('live-time').innerText = formatDuration(secondsElapsed);
          const speed = secondsElapsed > 0 ? (distanceKm / (secondsElapsed / 3600)).toFixed(1) : '0.0';
          document.getElementById('live-speed').innerText = `${speed} km/u`;
        }, 1000);

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            updateCount++;
            const { latitude, longitude, accuracy } = pos.coords;
            const acc = Math.round(accuracy);

            statusEl.className = 'text-xs text-emerald-700 mb-4 bg-emerald-50 py-1.5 px-3 rounded-lg border border-emerald-200 inline-block font-mono';
            statusEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> GPS actief (±${acc}m | #${updateCount})`;

            if (lastCoords) {
              const d = calcDistance(lastCoords.lat, lastCoords.lng, latitude, longitude);
              if (d > 0.003) {
                distanceKm += d;
                document.getElementById('live-distance').innerText = distanceKm.toFixed(2);
                lastCoords = { lat: latitude, lng: longitude };
              }
            } else {
              lastCoords = { lat: latitude, lng: longitude };
            }
          },
          (err) => {
            let msg = 'Onbekende GPS fout';
            if (err.code === 1) msg = 'Toegang geweigerd';
            if (err.code === 2) msg = 'Geen GPS signaal';
            if (err.code === 3) msg = 'GPS time-out';
            statusEl.className = 'text-xs text-rose-600 mb-4 bg-rose-50 py-1.5 px-3 rounded-lg border border-rose-200 inline-block font-mono';
            statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${msg}`;
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      } else {
        isTracking = false;
        clearInterval(timerId);
        navigator.geolocation.clearWatch(watchId);
        releaseWakeLock();

        const durationFormatted = formatDuration(secondsElapsed);

        btn.innerHTML = '<i class="fa-solid fa-play"></i> Start Rit';
        btn.className = 'flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2';

        statusEl.className = 'text-xs text-slate-400 mb-4 bg-slate-50 py-1.5 px-3 rounded-lg border border-slate-100 inline-block font-mono';
        statusEl.innerText = 'GPS stand-by';

        if (distanceKm > 0.05) {
          const type = confirm('Was dit een zakelijke rit? (Klik Annuleren voor Privé)') ? 'Zakelijk' : 'Privé';
          trips.unshift({
            id: Date.now(),
            date: new Date().toISOString().split('T')[0],
            from: 'GPS Startpunt',
            to: 'GPS Eindpunt',
            km: parseFloat(distanceKm.toFixed(2)),
            duration: durationFormatted,
            type: type
          });
          saveTrips();
        } else {
          alert('Rit gestopt (afstand was te kort om op te slaan).');
        }
        document.getElementById('live-distance').innerText = '0.00';
        document.getElementById('live-time').innerText = '00:00:00';
        document.getElementById('live-speed').innerText = '0.0 km/u';
      }
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function handleManualSubmit(e) {
      e.preventDefault();
      trips.unshift({
        id: Date.now(),
        date: document.getElementById('m-date').value,
        from: document.getElementById('m-from').value,
        to: document.getElementById('m-to').value,
        km: parseFloat(document.getElementById('m-km').value),
        duration: document.getElementById('m-duration').value || '-',
        type: document.getElementById('m-type').value
      });
      saveTrips();
      e.target.reset();
      document.getElementById('m-date').value = new Date().toISOString().split('T')[0];
    }

    function deleteTrip(id) {
      if (confirm('Wil je deze rit verwijderen?')) {
        trips = trips.filter(t => t.id !== id);
        saveTrips();
      }
    }

    function saveTrips() {
      localStorage.setItem('triplog_trips', JSON.stringify(trips));
      render();
    }

    function render() {
      const list = document.getElementById('trips-list');
      list.innerHTML = '';
      let total = 0, bKm = 0, pKm = 0;

      trips.forEach(t => {
        total += t.km;
        if (t.type === 'Zakelijk') bKm += t.km; else pKm += t.km;

        const el = document.createElement('div');
        el.className = 'bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between';
        el.innerHTML = `
          <div>
            <div class="flex items-center gap-2 mb-0.5">
              <span class="text-xs font-bold ${t.type === 'Zakelijk' ? 'text-blue-600 bg-blue-50' : 'text-slate-600 bg-slate-100'} px-2 py-0.5 rounded-md">${t.type}</span>
              <span class="text-xs text-slate-400">${t.date}</span>
              ${t.duration ? `<span class="text-xs text-slate-400 font-mono"><i class="fa-regular fa-clock ml-1"></i> ${t.duration}</span>` : ''}
            </div>
            <div class="text-sm font-semibold text-slate-700">${t.from} → ${t.to}</div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-base font-bold text-slate-900">${t.km} km</span>
            <button onclick="deleteTrip(${t.id})" class="text-slate-300 hover:text-rose-500 p-1"><i class="fa-solid fa-trash-can text-sm"></i></button>
          </div>
        `;
        list.appendChild(el);
      });

      if (trips.length === 0) {
        list.innerHTML = '<div class="text-center py-6 text-xs text-slate-400">Nog geen ritten opgeslagen.</div>';
      }

      document.getElementById('total-km').innerText = `${total.toFixed(1)} km`;
      document.getElementById('business-km').innerText = `${bKm.toFixed(1)} km`;
      document.getElementById('private-km').innerText = `${pKm.toFixed(1)} km`;
    }

    function exportCSV() {
      if (trips.length === 0) { alert('Geen data om te exporteren'); return; }
      let csv = 'Datum;Van;Naar;Type;Kilometers;Rijtijd\n';
      trips.forEach(t => { 
        const dur = t.duration || '-';
        csv += `"${t.date}";"${t.from}";"${t.to}";"${t.type}";"${t.km}";"${dur}"\n`; 
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `rittenadministratie_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }

    document.getElementById('m-date').value = new Date().toISOString().split('T')[0];
    render();
  </script>
</body>
</html>
